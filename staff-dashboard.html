<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wahana Cafe - Kitchen & Staff Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #15291b; color: #f4efe6; }
    h1, h2, h3, .font-heading { font-family: 'Fredoka', cursive; }
    .bg-forest { background-color: #1e3a27; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Header Bar -->
    <header class="bg-forest border border-white/10 rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold font-heading text-cream">Wahana Kitchen Dashboard</h1>
        <p class="text-xs text-amber-300">Baler, Aurora • Real-time Sync Engine</p>
      </div>

      <!-- Store Availability Toggle -->
      <div class="flex items-center bg-black/30 p-1.5 rounded-2xl border border-white/10">
        <button onclick="setStoreStatus('accepting')" id="status-btn-accepting" class="px-4 py-2 rounded-xl text-xs font-bold transition">Accepting</button>
        <button onclick="setStoreStatus('not_accepting')" id="status-btn-not_accepting" class="px-4 py-2 rounded-xl text-xs font-bold transition">Not Accepting</button>
        <button onclick="setStoreStatus('closed')" id="status-btn-closed" class="px-4 py-2 rounded-xl text-xs font-bold transition">Closed</button>
      </div>
    </header>

    <!-- Shift Management Bar -->
    <div class="bg-forest border border-white/10 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-4 text-xs">
        <div>
          <span class="text-white/50 block">Shift Leader</span>
          <input type="text" id="shift-leader" value="Archie" class="bg-black/30 border border-white/20 rounded-lg px-2.5 py-1 text-amber-300 font-bold focus:outline-none">
        </div>
        <div>
          <span class="text-white/50 block">Date</span>
          <input type="date" id="shift-date" class="bg-black/30 border border-white/20 rounded-lg px-2.5 py-1 text-cream focus:outline-none">
        </div>
      </div>
      <button onclick="confirmResetShift()" class="bg-red-500/20 hover:bg-red-500 text-red-200 hover:text-white border border-red-500/40 font-bold text-xs px-4 py-2 rounded-xl transition">
        🔄 Reset / Next Day Shift
      </button>
    </div>

    <!-- Live Metrics Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-forest border border-white/10 p-5 rounded-2xl">
        <span class="text-xs text-white/50 block">Total Cash Collected</span>
        <span id="metric-total-cash" class="text-2xl font-bold font-heading text-emerald-400">₱0.00</span>
      </div>
      <div class="bg-forest border border-white/10 p-5 rounded-2xl">
        <span class="text-xs text-white/50 block">Completed Orders</span>
        <span id="metric-completed-count" class="text-2xl font-bold font-heading text-amber-400">0</span>
      </div>
      <div class="bg-forest border border-white/10 p-5 rounded-2xl">
        <span class="text-xs text-white/50 block">Active Orders</span>
        <span id="metric-active-count" class="text-2xl font-bold font-heading text-blue-400">0</span>
      </div>
      <div class="bg-forest border border-white/10 p-5 rounded-2xl">
        <span class="text-xs text-white/50 block">Total Received</span>
        <span id="metric-total-received" class="text-2xl font-bold font-heading text-purple-400">0</span>
      </div>
    </div>

    <!-- Menu Stock Management Section -->
    <section class="bg-forest border border-white/10 rounded-2xl p-6">
      <h2 class="text-xl font-bold font-heading text-amber-300 mb-4">Live Menu Availability Stock Toggles</h2>
      <div id="menu-stock-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
        <!-- Dynamic Stock Toggles -->
      </div>
    </section>

    <!-- Active Orders Queue -->
    <main>
      <h2 class="text-xl font-bold font-heading text-amber-300 mb-4">Active Orders Queue</h2>
      <div id="orders-queue" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Dynamic Orders -->
      </div>
    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://ovnrgbqbfpebqjparxyq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LY5jsImbX5WCF8ZoWwXXPA_xWTRjQqj";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allOrders = [];
    let menuItems = [
      { id: 1, name: "Maple & Butter Pancakes", category: "Pancakes & Waffles", price: 80, is_available: true },
      { id: 2, name: "Chocolate Chip Pancakes", category: "Pancakes & Waffles", price: 110, is_available: true },

      { id: 5, name: "Garlic Longganisa", category: "Rice Meals", price: 120, is_available: true },

      { id: 14, name: "Nachos", category: "Snacks", price: 200, is_available: true },
      { id: 15, name: "Mojo", category: "Snacks", price: 150, is_available: true },
      { id: 16, name: "Lumpiang Shanghai", category: "Snacks", price: 145, is_available: true },
      { id: 17, name: "Classic Cheese Stick", category: "Snacks", price: 100, is_available: true },
      { id: 18, name: "Pizza Margherita", category: "Pizza", price: 250, is_available: true },
      { id: 19, name: "Olive & Bacon Pizza", category: "Pizza", price: 280, is_available: true },
      { id: 20, name: "Honey Salami Pizza", category: "Pizza", price: 300, is_available: true },
      { id: 21, name: "Honey Truffle 4-Cheese Pizza", category: "Pizza", price: 300, is_available: true },
      { id: 22, name: "Four Cheese Pizza", category: "Pizza", price: 300, is_available: true },
      { id: 23, name: "Pepperoni Pizza", category: "Pizza", price: 300, is_available: true },
      { id: 24, name: "Drip Coffee", category: "Espresso Drinks", price: 80, is_available: true },
      { id: 25, name: "Sweet Misto", category: "Espresso Drinks", price: 100, is_available: true },
      { id: 26, name: "Americano", category: "Espresso Drinks", price: 100, is_available: true },

      { id: 29, name: "Caramel Macchiato", category: "Espresso Drinks", price: 140, is_available: true },
      { id: 30, name: "Hazelnut Mocha", category: "Espresso Drinks", price: 140, is_available: true },
      { id: 31, name: "Matcha Espresso Fusion", category: "Espresso Drinks", price: 140, is_available: true },

      { id: 33, name: "White Chocolate Espresso", category: "Espresso Drinks", price: 150, is_available: true },
      { id: 34, name: "Signature Chocolate", category: "Non-Coffee", price: 140, is_available: true },
      { id: 35, name: "Matcha Latte", category: "Non-Coffee", price: 140, is_available: true },
      { id: 36, name: "Strawberry Milk", category: "Non-Coffee", price: 150, is_available: true },
      { id: 37, name: "Blueberry Milk", category: "Non-Coffee", price: 150, is_available: true },
      { id: 38, name: "Mango Milk", category: "Non-Coffee", price: 150, is_available: true },
      { id: 39, name: "Lychee Soda", category: "Soda & Refreshers", price: 99, is_available: true },
      { id: 40, name: "Mango Soda", category: "Soda & Refreshers", price: 99, is_available: true },
      { id: 41, name: "Green Apple Mango Soda", category: "Soda & Refreshers", price: 99, is_available: true },
      { id: 42, name: "Aurora Sunrise Hazy Pale Ale (330ml)", category: "Local Craft Beer", price: 130, is_available: true },
      { id: 43, name: "Aurora Sunrise Hazy Pale Ale (500ml)", category: "Local Craft Beer", price: 200, is_available: true },
      { id: 44, name: "Wahana Blonde Ale (330ml)", category: "Local Craft Beer", price: 100, is_available: true },
      { id: 45, name: "Wahana Blonde Ale (500ml)", category: "Local Craft Beer", price: 150, is_available: true },
      { id: 46, name: "Milky Way Chocolate Stout (330ml)", category: "Local Craft Beer", price: 150, is_available: true },
      { id: 47, name: "Milky Way Chocolate Stout (500ml)", category: "Local Craft Beer", price: 220, is_available: true },
      { id: 48, name: "Jawbreaker 181 IPA (330ml)", category: "Local Craft Beer", price: 180, is_available: true },
      { id: 49, name: "Jawbreaker 181 IPA (500ml)", category: "Local Craft Beer", price: 270, is_available: true },
      { id: 50, name: "Roses are Red Sour (330ml)", category: "Local Craft Beer", price: 130, is_available: true },
      { id: 51, name: "Roses are Red Sour (500ml)", category: "Local Craft Beer", price: 200, is_available: true },
      { id: 52, name: "Flavored Syrup Add-on", category: "Add-ons", price: 30, is_available: true },
      { id: 53, name: "Espresso Shot Add-on", category: "Add-ons", price: 30, is_available: true },
      { id: 54, name: "Whipped Cream Add-on", category: "Add-ons", price: 30, is_available: true }
    ];

    async function initDashboard() {
      const today = new Date().toISOString().split('T')[0];
      const dateEl = document.getElementById('shift-date');
      if (dateEl) dateEl.value = today;

      await fetchOrders();
      await fetchStoreStatus();
      await fetchMenuItems();
    }

    async function fetchOrders() {
      try {
        const { data, error } = await supabaseClient
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data) {
          allOrders = data;
          renderOrders();
          calculateMetrics();
        }
      } catch (err) {}
    }

    async function fetchMenuItems() {
      try {
        const { data, error } = await supabaseClient
          .from('menu_items')
          .select('*')
          .order('id');

        if (!error && data && data.length > 0) {
          menuItems = data;
        }
      } catch (err) {}
      renderMenuStockGrid();
    }

    function renderMenuStockGrid() {
      const grid = document.getElementById('menu-stock-grid');
      if (!grid) return;
      grid.innerHTML = menuItems.map(item => `
        <div class="bg-black/20 border border-white/10 rounded-xl p-3 flex justify-between items-center">
          <div>
            <h4 class="font-bold text-xs text-cream">${item.name}</h4>
            <span class="text-[10px] text-amber-300">₱${item.price}</span>
          </div>
          <button onclick="toggleItemStock(${item.id}, ${item.is_available === false ? true : false})" class="px-3 py-1.5 rounded-lg text-[10px] font-bold transition ${item.is_available !== false ? 'bg-emerald-500 text-black hover:bg-emerald-400' : 'bg-red-500/20 text-red-300 border border-red-500/40 hover:bg-red-500 hover:text-white'}">
            ${item.is_available !== false ? 'In Stock' : 'Out of Stock'}
          </button>
        </div>
      `).join('');
    }

    async function toggleItemStock(id, newStatus) {
      try {
        await supabaseClient
          .from('menu_items')
          .update({ is_available: newStatus, updated_at: new Date() })
          .eq('id', id);
      } catch (err) {
        const item = menuItems.find(m => m.id === id);
        if (item) item.is_available = newStatus;
      }
      fetchMenuItems();
    }

    function renderOrders() {
      const queue = document.getElementById('orders-queue');
      if (!queue) return;
      const activeOrders = allOrders.filter(o => o.status !== 'Completed' && o.status !== 'Cancelled');

      if (activeOrders.length === 0) {
        queue.innerHTML = `
          <div class="col-span-full bg-forest/40 border border-dashed border-white/10 rounded-2xl p-12 text-center text-white/40">
            No active orders in queue. Waiting for customer requests...
          </div>
        `;
        return;
      }

      queue.innerHTML = activeOrders.map(order => `
        <div class="bg-forest border border-white/10 rounded-2xl p-5 space-y-4 shadow-lg">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-mono font-bold bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-md uppercase">${order.order_type}</span>
              <h3 class="font-bold text-lg text-cream mt-2">${order.customer_name}</h3>
              <p class="text-xs text-white/60">${order.contact_number}</p>
            </div>
            <span class="text-xs font-mono text-white/40">#${order.ref_id || order.id.slice(0,6)}</span>
          </div>

          <div class="bg-black/30 p-3 rounded-xl text-xs space-y-1">
            ${order.order_type === 'dine-in' ? `<p><strong class="text-amber-300">Table:</strong> ${order.table_number}</p>` : ''}
            ${order.order_type === 'take-out' ? `<p><strong class="text-amber-300">Claim Code:</strong> ${order.claim_number}</p>` : ''}
            ${order.order_type === 'delivery' ? `<p><strong class="text-amber-300">Address:</strong> ${order.address}</p>` : ''}
          </div>

          <div class="space-y-1.5 border-t border-b border-white/10 py-3 text-xs">
            ${(order.items || []).map(i => `<div class="flex justify-between"><span>${i.qty}x ${i.name}</span><span class="font-bold">₱${i.price * i.qty}</span></div>`).join('')}
            <div class="flex justify-between font-bold text-amber-300 text-sm pt-2">
              <span>Total</span>
              <span>₱${order.total_amount}</span>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-white/50 uppercase mb-1">Update Status</label>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="updateOrderStatus('${order.id}', 'Preparing')" class="px-3 py-2 rounded-xl text-xs font-bold ${order.status === 'Preparing' ? 'bg-amber-500 text-black' : 'bg-white/10 text-white/70'} hover:bg-amber-400 hover:text-black transition">Preparing</button>
              <button onclick="updateOrderStatus('${order.id}', '${getReadyStatusText(order.order_type)}')" class="px-3 py-2 rounded-xl text-xs font-bold ${order.status.startsWith('Ready') ? 'bg-emerald-500 text-black' : 'bg-white/10 text-white/70'} hover:bg-emerald-400 hover:text-black transition">${getReadyStatusText(order.order_type)}</button>
            </div>
            <button onclick="updateOrderStatus('${order.id}', 'Completed')" class="w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-2 rounded-xl transition">
              ✓ Mark Complete
            </button>
          </div>
        </div>
      `).join('');
    }

    function getReadyStatusText(type) {
      if (type === 'dine-in') return 'Ready to Serve';
      if (type === 'take-out') return 'Ready to Claim';
      return 'Ready to Deliver';
    }

    async function updateOrderStatus(id, newStatus) {
      try {
        await supabaseClient
          .from('orders')
          .update({ status: newStatus, updated_at: new Date() })
          .eq('id', id);
      } catch (err) {}
      fetchOrders();
    }

    function calculateMetrics() {
      const completed = allOrders.filter(o => o.status === 'Completed');
      const active = allOrders.filter(o => o.status !== 'Completed' && o.status !== 'Cancelled');
      const cashTotal = completed.reduce((acc, o) => acc + Number(o.total_amount), 0);

      const cashEl = document.getElementById('metric-total-cash');
      const compEl = document.getElementById('metric-completed-count');
      const actEl = document.getElementById('metric-active-count');
      const recEl = document.getElementById('metric-total-received');

      if (cashEl) cashEl.textContent = `₱${cashTotal.toFixed(2)}`;
      if (compEl) compEl.textContent = completed.length;
      if (actEl) actEl.textContent = active.length;
      if (recEl) recEl.textContent = allOrders.length;
    }

    async function fetchStoreStatus() {
      try {
        const { data } = await supabaseClient.from('store_settings').select('*').eq('id', 1).single();
        if (data) renderStoreStatusButtons(data.store_status);
      } catch (err) {}
    }

    async function setStoreStatus(status) {
      try {
        await supabaseClient.from('store_settings').update({ store_status: status }).eq('id', 1);
      } catch (err) {}
      renderStoreStatusButtons(status);
    }

    function renderStoreStatusButtons(status) {
      ['accepting', 'not_accepting', 'closed'].forEach(s => {
        const btn = document.getElementById(`status-btn-${s}`);
        if (!btn) return;
        if (s === status || (s === 'accepting' && status === 'OPEN')) {
          btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-black shadow-md";
        } else {
          btn.className = "px-4 py-2 rounded-xl text-xs font-bold text-white/50 hover:text-white transition";
        }
      });
    }

    async function confirmResetShift() {
      if (!confirm("Are you sure you want to reset for the next day shift? This will clear active and completed orders from the queue.")) return;

      try {
        await supabaseClient.from('orders').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      } catch (err) {
        allOrders = [];
      }
      
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + 1);
      const dateEl = document.getElementById('shift-date');
      if (dateEl) dateEl.value = nextDate.toISOString().split('T')[0];

      fetchOrders();
      alert("Shift reset complete! Orders queue cleared.");
    }

    initDashboard();

    setInterval(() => {
      fetchOrders();
      fetchStoreStatus();
      fetchMenuItems();
    }, 3000);
  </script>
</body>
</html>
